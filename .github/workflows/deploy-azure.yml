# Builds the application image in Azure Container Registry and puts it on a new Container Apps
# revision.
#
# Two ways in:
#   - automatic: every push to main whose CI run passes, once the repository variable
#     AZURE_AUTO_DEPLOY is true (set it after the first deploy from Cloud Shell, docs/AZURE.md).
#     The new revision gets traffic only when its /health answers 200; otherwise traffic stays
#     on the revision that was live.
#   - manual: Run workflow, for a chosen tag; traffic moves only when the dispatch asks for it.
# Either way the job waits for the reviewers of the azure environment, when it has any.
#
# Sign-in uses OIDC federated credentials: no secret value is kept in the repository. What the
# repository needs, and how to set it up, is in docs/AZURE.md.
#   secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   variables: AZURE_RESOURCE_GROUP, AZURE_CONTAINER_REGISTRY, AZURE_CONTAINER_APP,
#              ENTRA_TENANT_ID, ENTRA_CLIENT_ID, ENTRA_ADMIN_GROUP_NAME, ENTRA_MEMBER_GROUP_NAME
name: Deploy to Azure

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag in ACR. Empty uses the short commit sha."
        required: false
        default: ""
      send_traffic:
        description: "Send all traffic to the new revision. Leave off to test it on its own address first."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    # Automatic runs only for a passing CI run of a push to main, and only once auto-deploy is switched on.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AZURE_AUTO_DEPLOY == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Add required reviewers to this environment in the repository settings to gate go-live.
    environment: azure
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Work out the tag
        id: tag
        env:
          # Passed through the environment, never pasted into the script (security review L1).
          IMAGE_TAG: ${{ inputs.image_tag }}
          SEND_TRAFFIC: ${{ github.event_name == 'workflow_run' || inputs.send_traffic }}
        run: |
          tag="$IMAGE_TAG"
          if [ -z "$tag" ]; then tag="$(git rev-parse --short HEAD)"; fi
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::image_tag must be a Docker tag: letters, digits, _ . - and at most 128 characters"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          slug=$(printf '%s' "$tag" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
          echo "suffix=r$slug-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          if [ "$SEND_TRAFFIC" = "true" ]; then
            echo "send_traffic=true" >> "$GITHUB_OUTPUT"
          else
            echo "send_traffic=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare the CLI
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az extension add --name containerapp --upgrade --only-show-errors

      # Sign-in settings come from the Bicep deployment (docs/AZURE.md section 6); this workflow never sets
      # them. It stops before building when the app does not carry the Entra values the repository
      # variables name, or still carries an old sign-in setting, so a revision never starts half-configured.
      - name: Check the Entra sign-in settings
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_ADMIN_GROUP_NAME: ${{ vars.ENTRA_ADMIN_GROUP_NAME }}
          ENTRA_MEMBER_GROUP_NAME: ${{ vars.ENTRA_MEMBER_GROUP_NAME }}
        run: |
          az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].env" -o json > app-env.json
          python3 - <<'PY'
          import json, os, re, sys
          env = {item["name"]: item.get("value", "") for item in json.load(open("app-env.json"))}
          guid = re.compile(r"^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")
          problems = []
          for var in ("ENTRA_TENANT_ID", "ENTRA_CLIENT_ID"):
              want = os.environ[var].strip().lower()
              if not guid.match(want):
                  problems.append(f"repository variable {var} must be a GUID")
              elif env.get(f"INV_STUDIO_{var}", "").strip().lower() != want:
                  problems.append(f"INV_STUDIO_{var} on the app does not match the repository variable {var}")
          for var in ("ENTRA_ADMIN_GROUP_NAME", "ENTRA_MEMBER_GROUP_NAME"):
              if env.get(f"INV_STUDIO_{var}", "") != os.environ[var]:
                  problems.append(f"INV_STUDIO_{var} on the app does not match the repository variable {var}")
          old = ("GOOGLE_CLOUD_PROJECT", "INV_STUDIO_ALLOWED_EMAILS", "INV_STUDIO_MEMBER_EMAILS", "INV_STUDIO_IDENTITY_ADMIN")
          leftover = sorted(name for name in env if name in old or name.startswith("INV_STUDIO_FIREBASE_"))
          if leftover:
              problems.append("the app still sets old sign-in settings: " + ", ".join(leftover))
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              print("Run the Bicep deployment with the Entra parameters first (docs/AZURE.md section 6).", file=sys.stderr)
              sys.exit(1)
          print("Entra sign-in settings match.")
          PY

      - name: Pin traffic to the revision that is live now
        id: live
        run: |
          live=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.latestReadyRevisionName" -o tsv)
          echo "revision=$live" >> "$GITHUB_OUTPUT"
          if [ -n "$live" ]; then
            az containerapp ingress traffic set \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --revision-weight "$live=100" --only-show-errors -o none
          fi

      # The image is about 5.6 GB with the OCR models, well past what a hosted runner can hold.
      # ACR Tasks builds it inside Azure from the uploaded source, so nothing large crosses the network.
      - name: Build the image in ACR
        run: |
          az acr build \
            --registry "${{ vars.AZURE_CONTAINER_REGISTRY }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --platform linux/amd64 \
            --file Dockerfile \
            --image "inv-studio:${{ steps.tag.outputs.tag }}" \
            --timeout 14400 \
            .

      # The candidate runs with INV_STUDIO_RECOVER_JOBS=0: it shares the live database and must not take
      # over invoices the live revision is reading (docs/AZURE.md section 9, "Invoices in flight").
      - name: Create the candidate revision
        id: revision
        run: |
          server=$(az acr show --name "${{ vars.AZURE_CONTAINER_REGISTRY }}" --query loginServer -o tsv)
          # Deploy by digest, not by tag, the way docs/RUNBOOK.md does on Cloud Run.
          digest=$(az acr manifest show-metadata \
            --name "$server/inv-studio:${{ steps.tag.outputs.tag }}" \
            --query digest -o tsv 2>/dev/null) || digest=""
          if [ -z "$digest" ]; then
            digest=$(az acr repository show \
              --name "${{ vars.AZURE_CONTAINER_REGISTRY }}" \
              --image "inv-studio:${{ steps.tag.outputs.tag }}" \
              --query digest -o tsv)
          fi
          echo "Deploying $server/inv-studio@$digest"
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$server/inv-studio@$digest" \
            --revision-suffix "${{ steps.tag.outputs.suffix }}" \
            --set-env-vars INV_STUDIO_RECOVER_JOBS=0 \
            --only-show-errors -o none
          new="${{ vars.AZURE_CONTAINER_APP }}--${{ steps.tag.outputs.suffix }}"
          echo "revision=$new" >> "$GITHUB_OUTPUT"
          echo "image=$server/inv-studio@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Check the candidate is healthy
        run: |
          scripts/azure_revision_ready.sh "${{ vars.AZURE_CONTAINER_APP }}" "${{ vars.AZURE_RESOURCE_GROUP }}" \
            "${{ steps.revision.outputs.revision }}"

      # Go live as docs/AZURE.md section 8: a fresh revision from the same digest without
      # INV_STUDIO_RECOVER_JOBS, checked on its own address, then the traffic, then the candidate stops.
      - name: Create the live revision
        id: live_revision
        if: ${{ steps.tag.outputs.send_traffic == 'true' }}
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.revision.outputs.image }}" \
            --revision-suffix "${{ steps.tag.outputs.suffix }}-live" \
            --remove-env-vars INV_STUDIO_RECOVER_JOBS \
            --only-show-errors -o none
          echo "revision=${{ steps.revision.outputs.revision }}-live" >> "$GITHUB_OUTPUT"

      - name: Check the live revision is healthy
        if: ${{ steps.tag.outputs.send_traffic == 'true' }}
        run: |
          scripts/azure_revision_ready.sh "${{ vars.AZURE_CONTAINER_APP }}" "${{ vars.AZURE_RESOURCE_GROUP }}" \
            "${{ steps.live_revision.outputs.revision }}"

      - name: Send traffic to the live revision
        id: promote
        if: ${{ steps.tag.outputs.send_traffic == 'true' }}
        run: |
          az containerapp ingress traffic set \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --revision-weight "${{ steps.live_revision.outputs.revision }}=100" \
            --only-show-errors -o none
          app=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          for _ in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$app/health" || echo 000)
            echo "https://$app/health: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "The app did not answer /health with 200 after the switch." >&2
          exit 1

      - name: Stop the candidate
        if: ${{ steps.tag.outputs.send_traffic == 'true' }}
        run: |
          az containerapp revision deactivate \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --revision "${{ steps.revision.outputs.revision }}" \
            --only-show-errors -o none

      - name: Roll back to the revision that was live
        if: ${{ failure() && steps.promote.conclusion == 'failure' && steps.live.outputs.revision != '' }}
        run: |
          az containerapp ingress traffic set \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --revision-weight "${{ steps.live.outputs.revision }}=100" \
            --only-show-errors -o none
          echo "::error::Rolled traffic back to ${{ steps.live.outputs.revision }}."

      - name: Report
        if: ${{ always() && steps.revision.outputs.revision != '' }}
        run: |
          app=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          revision=$(az containerapp revision show \
            --revision "${{ steps.revision.outputs.revision }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.fqdn" -o tsv)
          {
            echo "### Azure deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${{ steps.tag.outputs.tag }}\` |"
            echo "| Digest | \`${{ steps.revision.outputs.digest }}\` |"
            echo "| Candidate revision | \`${{ steps.revision.outputs.revision }}\` |"
            echo "| Live revision | \`${{ steps.live_revision.outputs.revision }}\` |"
            echo "| Revision address | https://$revision |"
            echo "| App address | https://$app |"
            echo "| Previous revision | \`${{ steps.live.outputs.revision }}\` |"
            echo "| Traffic moved | ${{ steps.tag.outputs.send_traffic }} |"
            echo ""
            if [ -n "${{ steps.live.outputs.revision }}" ]; then
              echo "Roll back with:"
              echo '```'
              echo "az containerapp ingress traffic set -n ${{ vars.AZURE_CONTAINER_APP }} -g ${{ vars.AZURE_RESOURCE_GROUP }} --revision-weight ${{ steps.live.outputs.revision }}=100"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
