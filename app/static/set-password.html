<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Set your password · Invoice Studio</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <section id="auth-gate" class="auth-gate" aria-labelledby="auth-title">
      <div class="auth-card">
        <span class="auth-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 4.5h11l5 5V27.5H8z"/><path d="M19 4.5v5h5M12 15h8M12 19h8M12 23h5"/></svg></span>
        <p class="eyebrow">Secure invoice workspace</p>
        <h1 id="auth-title">Invoice Studio</h1>
        <p id="sp-message" role="status" aria-live="polite" tabindex="-1">Checking your link…</p>
        <span id="sp-spinner" class="spinner" aria-hidden="true"></span>
        <form id="sp-form" class="password-sign-in" hidden>
          <label>Email<input id="sp-email" type="email" autocomplete="username" readonly></label>
          <label>New password<input id="sp-password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label>
          <label>Repeat password<input id="sp-confirm" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label>
          <button id="sp-submit" class="button button-primary auth-button" type="submit">Save password</button>
        </form>
        <a id="sp-sign-in" class="button button-primary auth-button" href="/" hidden>Go to sign-in</a>
        <button id="sp-retry" class="button button-secondary auth-button" type="button" hidden>Try again</button>
        <p id="sp-detail" class="auth-detail" role="status" aria-live="polite" hidden></p>
        <p class="auth-privacy">Use at least 12 characters. The link works once and expires; ask your workspace administrator for a new one if it has stopped working.</p>
      </div>
    </section>
    <script src="/static/firebase-auth.bundle.js" defer></script>
    <script src="/static/set-password.js" defer></script>
  </body>
</html>
