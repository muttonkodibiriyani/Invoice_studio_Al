# Cloud Run environment file. Copy outside version control, or generate it from
# the shared .env list so local and cloud use one set of names:
#
#   python scripts/cloud_env.py .env > /private/path/cloud.env.yaml
#
# INV_STUDIO_DATABASE_URL, INV_STUDIO_VAULT_KEY and INV_STUDIO_AZURE_API_KEY are
# not here: the live service mounts them from Secret Manager (docs/RUNBOOK.md).
# Public Firebase web configuration is not a service-account key.
INV_STUDIO_CLOUD: '1'
GOOGLE_CLOUD_PROJECT: 'your-project'
INV_STUDIO_DATA: '/tmp/inv-studio-data'
INV_STUDIO_BUCKET: 'your-private-invoice-evidence-bucket'
INV_STUDIO_ALLOWED_EMAILS: 'approved.owner@example.com'
INV_STUDIO_ALLOWED_ORIGINS: 'https://your-separate-site.web.app,https://your-separate-site.firebaseapp.com'
INV_STUDIO_FIREBASE_API_KEY: 'public-firebase-web-api-key'
INV_STUDIO_FIREBASE_AUTH_DOMAIN: 'your-project.firebaseapp.com'
INV_STUDIO_FIREBASE_APP_ID: 'your-firebase-web-app-id'
# Optional managed AI reader, used when an administrator has not chosen a model.
# Vertex AI uses the runtime service account, so it needs no key.
# VERTEX_PROJECT_ID: 'your-project'
# VERTEX_LOCATION: 'us-central1'
# VERTEX_MODEL: 'gemini-3.7-flash'
# Azure AI Foundry: the resource endpoint and the deployment to read with. The
# key is mounted from Secret Manager as INV_STUDIO_AZURE_API_KEY.
# INV_STUDIO_AZURE_ENDPOINT: 'https://your-resource.openai.azure.com'
# INV_STUDIO_AZURE_DEPLOYMENT: 'your-deployment-name'
# Which managed reader is the default when both are configured (vertex | azure).
# INV_STUDIO_DEFAULT_PROVIDER: 'vertex'
# Dollars per million tokens for the spend ledger, keyed by model or deployment name.
# INV_STUDIO_AI_PRICES: '{"your-deployment-name": {"input": 2.0, "output": 8.0, "cached": 0.5}}'
