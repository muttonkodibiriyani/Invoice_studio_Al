[project]
name = "inv-studio"
version = "0.1.0"
description = "Local invoice reading, reference matching, review and Excel workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "python-multipart>=0.0.20,<1",
  "pydantic==2.13.5", "httpx==0.28.1", "cryptography>=46,<51",
  "PyJWT[crypto]==2.15.1", "invoice2data==1.0.1", "pdfplumber==0.11.10",
  "pypdfium2>=4.30,<6", "Pillow>=13,<14", "openpyxl==3.1.5", "PyYAML>=6,<7", "defusedxml>=0.7,<1",
  "rapidfuzz==3.14.6"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1", "reportlab>=4,<5"]
docling = ["docling==2.143.1"]
paddle = ["paddleocr==3.7.0", "paddlepaddle==3.3.1"]
cloud = ["firebase-admin==7.7.0", "google-cloud-storage==3.16.0", "psycopg[binary]==3.3.6"]
azure = ["azure-storage-blob==12.31.0", "azure-identity==1.27.0"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["static/*", "templates/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
# The golden scan tests need PaddleOCR, Docling and their models: pytest -m scan_readers (docs/GOLDEN_SAMPLES.md).
addopts = "-m 'not scan_readers'"
markers = ["scan_readers: reads a golden sample with PaddleOCR and Docling and their cached models"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E9", "F"]
